name: Teardown AWS (DESTRUCTIVE)

# Manual only. Destroys the vote-ingestion AWS stack (Aurora Serverless v2 — the
# ~$44/mo cost — plus SQS, the drain Lambda, and the VPC) via `cdk destroy`. Backs
# up first: a portable Data-API export (artifact) AND a final cluster snapshot.
# `cdk destroy` also auto-creates a final snapshot (RemovalPolicy.SNAPSHOT), so the
# data survives. Irreversible — guarded by a typed confirmation.
#
# Requires repo secrets for the e14-admin IAM user (Settings -> Secrets -> Actions):
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
# Region us-east-1, account 388768425935, stack E14VoteStack (round r1).

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DESTROY to confirm destroying the Aurora/SQS/Lambda stack'
        required: true
        default: ''

concurrency: teardown-aws

env:
  AWS_REGION: us-east-1

jobs:
  teardown:
    if: ${{ inputs.confirm == 'DESTROY' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Sanity check identity
        run: aws sts get-caller-identity

      - name: Resolve Aurora ARNs from stack outputs
        id: arns
        run: |
          out() { aws cloudformation describe-stacks --stack-name E14VoteStack \
            --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text; }
          echo "cluster=$(out AuroraClusterArn)" >> "$GITHUB_OUTPUT"
          echo "secret=$(out AuroraSecretArn)"   >> "$GITHUB_OUTPUT"

      - name: Final cluster snapshot (belt-and-suspenders)
        run: |
          CID=$(aws rds describe-db-clusters \
            --query "DBClusters[?contains(DBClusterIdentifier,'e14')].DBClusterIdentifier | [0]" --output text)
          if [ -n "$CID" ] && [ "$CID" != "None" ]; then
            aws rds create-db-cluster-snapshot --db-cluster-identifier "$CID" \
              --db-cluster-snapshot-identifier "e14-final-$(date +%Y%m%d-%H%M%S)"
          else
            echo "::warning::no e14 cluster found — skipping manual snapshot"
          fi

      - name: Portable Data-API export
        env:
          AURORA_CLUSTER_ARN: ${{ steps.arns.outputs.cluster }}
          AURORA_SECRET_ARN: ${{ steps.arns.outputs.secret }}
        run: |
          pip install boto3
          python3 infra/export_aurora.py || echo "::warning::export step failed — continuing (snapshot still taken)"

      - name: Upload Aurora export artifact
        uses: actions/upload-artifact@v4
        with:
          name: e14-aurora-export
          path: backup/
          if-no-files-found: warn

      - name: cdk destroy
        working-directory: infra
        run: |
          pip install -r requirements.txt
          npx --yes aws-cdk destroy E14VoteStack --force
          npx --yes aws-cdk destroy E14VoteStackR2 --force || echo "E14VoteStackR2 not deployed — skipping"

      - name: Confirm
        run: |
          echo "Remaining e14 clusters (expect none):"
          aws rds describe-db-clusters \
            --query "DBClusters[?contains(DBClusterIdentifier,'e14')].DBClusterIdentifier" --output text || true
          echo "AWS teardown complete. A final snapshot remains as your restore point."
