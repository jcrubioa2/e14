[project]
name = "e14-scraper"
version = "0.1.0"
description = "Resumable scraper for official Registraduria E-14 actas (2026 Colombian presidential election)"
requires-python = ">=3.11"
dependencies = [
    "curl_cffi>=0.7",   # Chrome TLS impersonation to pass Akamai bot management
    "requests>=2.31",   # used only by the optional GraphQL/SigV4 fallback (auth.py/api.py)
    "tenacity>=8.2",
    "tqdm>=4.66",
    "PyMuPDF>=1.24",
    "opencv-python>=4.9",
    "numpy>=1.26",
    "Pillow>=10.0",
    "pydantic>=2.7",
    "fastapi>=0.111,<0.116",
    "uvicorn[standard]>=0.30,<0.48",
    "jinja2>=3.1",
    "boto3>=1.34",      # vote path: SQS enqueue + Aurora Data API (serve & worker)
]

[project.scripts]
e14 = "e14.cli:main"
e14detector = "e14detector.cli:main"

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "httpx>=0.27,<0.28",
]
# Local-only: uploading crops to Fly Tigris / S3 (never imported by the serve image).
publish = [
    "boto3>=1.34",
]

[tool.pytest.ini_options]
# Scope collection to tests/ ONLY. Without this, a bare `pytest` walks the entire project
# tree during collection — including data/ (~1.5M acta crop files), which takes minutes and
# can segfault under the memory pressure. testpaths fixes the common case; norecursedirs is a
# belt-and-suspenders guard so an explicit path can never wander into the heavy dirs either.
testpaths = ["tests"]
norecursedirs = ["data", ".venv", ".git", "infra", "*.egg-info", "__pycache__"]
addopts = "-p no:cacheprovider"

[tool.setuptools]
packages = ["e14", "e14detector"]

[tool.setuptools.package-data]
e14detector = ["templates/*.html"]
