[project]
name = "e14-scraper"
version = "0.1.0"
description = "Resumable scraper for official Registraduria E-14 actas (2026 Colombian presidential election)"
requires-python = ">=3.11"
dependencies = [
    "curl_cffi>=0.7",   # Chrome TLS impersonation to pass Akamai bot management
    "requests>=2.31",   # used only by the optional GraphQL/SigV4 fallback (auth.py/api.py)
    "tenacity>=8.2",
    "tqdm>=4.66",
    "PyMuPDF>=1.24",
    "opencv-python>=4.9",
    "numpy>=1.26",
    "Pillow>=10.0",
    "pydantic>=2.7",
    "fastapi>=0.111,<0.116",
    "uvicorn[standard]>=0.30,<0.48",
    "jinja2>=3.1",
]

[project.scripts]
e14 = "e14.cli:main"
e14detector = "e14detector.cli:main"

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "httpx>=0.27,<0.28",
]
# Local-only: uploading crops to Fly Tigris / S3 (never imported by the serve image).
publish = [
    "boto3>=1.34",
]

[tool.setuptools]
packages = ["e14", "e14detector"]

[tool.setuptools.package-data]
e14detector = ["templates/*.html"]
