# fly.toml app configuration file generated for e14-poll on 2026-06-01T23:05:52-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'e14-poll'
primary_region = 'dfw'

[build]

[env]
  E14_COMMUNITY_DB = '/data/community.sqlite'
  E14_OPENROUTER_MODEL = 'qwen/qwen3-vl-8b-thinking'
  E14_SCREEN_MODEL = 'google/gemma-4-31b-it'
  E14_POLL_RESCALE_STEP = '5'
  E14_POLL_THRESHOLD = '5'
  E14_TURNSTILE_SITEKEY = '0x4AAAAAADdWyvx9OVxuUDFw'
  E14_VLM_PROVIDER = 'openrouter'
  # National rollout: serve the results DB from the volume (kept in sync from Tigris),
  # and crops from the public CDN. The reader pulls db/latest.json and atomic-swaps.
  E14_DB_SYNC = '1'
  E14_RESULTS_DB = '/data/results.sqlite'
  E14_OUTPUT_DIR = '/data'
  E14_CDN_BASE_URL = 'https://e14-crops.fly.storage.tigris.dev'
  E14_SITE_URL = 'https://veeduria-ciudadana-elecciones-colombia-2026.com'

[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = false
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 200
    soft_limit = 150

[[vm]]
  size = 'shared-cpu-2x'
  memory = '1024mb'
