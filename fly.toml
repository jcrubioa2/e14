# fly.toml app configuration file generated for e14-poll on 2026-06-01T23:05:52-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'e14-poll'
primary_region = 'dfw'

[build]

[env]
  E14_COMMUNITY_DB = '/data/community.sqlite'
  # Poll adjudication: K=3 self-consistency on gemma-4-31b (replaces Haiku — worst on the
  # hard cases AND priciest). Publish-as-strange needs a majority of the 3 reads; the
  # undetectable fused-dot class wobbles -> no majority -> stays re-eligible, never a
  # terminal false accusation. See plans/pending/voted-crop-adjudication.md.
  E14_OPENROUTER_MODEL = 'google/gemma-4-31b-it'
  E14_POLL_CONSENSUS_K = '3'
  E14_POLL_CONSENSUS_TEMP = '0.5'
  E14_SCREEN_MODEL = 'google/gemma-4-31b-it'
  E14_POLL_RESCALE_STEP = '5'
  E14_POLL_THRESHOLD = '5'
  # Vote rate limit (per IP-hash token bucket). Generous so genuine fast voting isn't throttled
  # — Turnstile now gates session entry, and this still caps a single IP at ~1 vote/s sustained
  # (60 burst). Raise if shared-NAT venues need more; lower if abuse appears.
  E14_RATE_REFILL_PER_MIN = '60'
  E14_RATE_BUCKET = '60'
  E14_TURNSTILE_SITEKEY = '0x4AAAAAADdWyvx9OVxuUDFw'
  # Turnstile on/off is controlled by the E14_TURNSTILE_ENABLED *secret* (currently 0)
  # so it can be flipped without a redeploy once the widget/secret are verified working.
  E14_VLM_PROVIDER = 'openrouter'
  # National rollout: serve the results DB from the volume (kept in sync from Tigris),
  # and crops from the public CDN. The reader pulls db/latest.json and atomic-swaps.
  E14_DB_SYNC = '1'
  E14_RESULTS_DB = '/data/results.sqlite'
  E14_OUTPUT_DIR = '/data'
  E14_CDN_BASE_URL = 'https://e14-crops.fly.storage.tigris.dev'
  E14_SITE_URL = 'https://veeduria-ciudadana-elecciones-colombia-2026.com'
  # Origins allowed to cast votes (/api/vote rejects a foreign browser Origin). The custom
  # domain is the real frontend; the *.fly.dev origin is kept so direct access still works
  # during the DNS transition — drop it once the app is served only via the custom domain.
  E14_ALLOWED_ORIGINS = 'https://veeduria-ciudadana-elecciones-colombia-2026.com,https://www.veeduria-ciudadana-elecciones-colombia-2026.com,https://e14-poll.fly.dev'

# Web-only app. Votes are enqueued by web to SQS and durably committed by the e14-vote-drain
# Lambda (see infra/), so neither web nor the DB being momentarily down loses a vote (SQS
# absorbs). Secrets (E14_VOTE_AWS_*, AURORA_*, SQS_QUEUE_URL) are set via `fly secrets set`.
# The SQS->Aurora vote drain moved to the `e14-vote-drain` Lambda (infra/lambda/handler.py,
# fed by an SQS event source mapping). It only runs when the queue has messages, so we no
# longer pay for an always-on worker machine. The web process still *publishes* to SQS.
[processes]
  # 1 worker for now — pre-election, traffic is low and a single worker is simplest. For the
  # election-day ramp, bump to `--workers 2` (~= both vCPUs of shared-cpu-2x; verified to boot
  # clean and share one OS page cache for the ~730MB results DB, so the second worker costs
  # little memory but doubles request concurrency). Horizontal scale is the other half, a
  # one-command op: `fly scale count N --region bog,dfw` — each machine is an identical
  # read-replica that pulls the DB snapshot from the CDN at boot.
  web = "uvicorn e14detector.asgi:app --host 0.0.0.0 --port 8000 --workers 1"

# Volume holds results.sqlite + DB-sync state — web only. (community.sqlite is gone;
# votes live in Aurora.)
[[mounts]]
  source = 'data'
  destination = '/data'
  processes = ['web']

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = false
  min_machines_running = 1
  processes = ['web']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 200
    soft_limit = 150

  # Readiness gate: /health returns 200 only once the results DB is present and non-stub, so a
  # freshly scaled-out machine never takes traffic before its DB snapshot is pulled and warm.
  [[http_service.checks]]
    interval = '15s'
    timeout = '4s'
    grace_period = '180s'
    method = 'get'
    path = '/health'

[[vm]]
  size = 'shared-cpu-2x'
  memory = '2048mb'
  processes = ['web']
